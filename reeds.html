<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano View with Notes</title>
    <link rel="stylesheet" href="piano.css" />
    <style>
        body {
            background-color: #d4d4d4;
            height: 100vh;
            margin: 0;
        }

        .piano-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px; /* Space between the piano views */
            height: 100vh;
        }
    </style>
</head>
<body>
<div class="piano-container" id="pianoContainer"></div>

<script src="piano.js"></script>
<script>
    const CUSTOM_PIANO_STYLE = {
        whiteKeyColor: 'white',
        blackKeyColor: 'black',
        whiteKeyStrokeColor: 'black',
        blackKeyStrokeColor: 'black',
        whiteKeyFontColor: 'black',
        blackKeyFontColor: 'white',
        highlightColor: 'limegreen',
        fontSizeFactor: 12,
    };

    const pianoConfigs = [
        [CUSTOM_PIANO_STYLE, 550, 160, 12, 'F', ['C', 'E', 'G']],
        // [{ ...CUSTOM_PIANO_STYLE }, 1200, 200, 22, 'C', ['C', 'E', 'G']],
        // [{}, 800, 250, 15, 'D', ['D', 'F#', 'A']] // Default style
    ];

    renderPianos(pianoConfigs, 'pianoContainer');
</script>

</body>
</html>
